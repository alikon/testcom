name: CI Alikonweb extensions Playground

# Cancel superseded runs on the same branch/PR instead of letting stale
# pushes keep burning runner minutes alongside newer ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DB_NAME: test_joomla
  DB_USER: joomla_ut
  DB_PASS: joomla_ut

jobs:
# -------------------------------------------------
# PHPCS (non-blocking, fully parallel with the build)
# NOTE: previously composer -> phpcs -> npm -> prepare_tests ran serially,
# but nothing downstream actually consumed composer's or phpcs's output.
# phpcs now runs standalone and in parallel with prepare_tests.
# -------------------------------------------------
  phpcs:
    runs-on: ubuntu-latest
    container:
      image: joomlaprojects/docker-images:php8.3
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-dependencies
      - name: Run PHP CS Fixer and PHPCS
        continue-on-error: true
        env:
          PHP_CS_FIXER_IGNORE_ENV: true
        run: |
          # 1. Check for styling issues without changing files (Logs errors to the console)
          ./vendor/bin/php-cs-fixer fix -vvv --dry-run --diff || true
          ./vendor/bin/phpcs --extensions=php -p --standard=ruleset.xml src/ || true

          # 2. Halt script immediately if any of the following modification/git steps fail
          set -e

          # 3. Apply actual fixes to the codebase
          ./vendor/bin/php-cs-fixer fix -vvv --diff

          # 4. Configure Git and safely push changes back to the repository
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REPOSITORY" != "alikon/testcom" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add --all

            if ! git diff --staged --quiet; then
              git commit -m "Fix code style issues [skip ci]"
              git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
            else
              echo "No code style changes detected. Skipping commit."
            fi
          fi

# -------------------------------------------------
# PREPARE TESTS (Joomla versions)
# Runs in parallel with phpcs now (no shared dependency).
#
# NOTE: this uses actions/cache (not upload/download-artifact) for the
# build handoff, on purpose. upload/download-artifact routes through
# Azure Blob Storage, which becomes unreliable ("Artifact download failed
# after 5 retries") once multiple jobs pull the same large artifact
# concurrently — exactly what happens here with 6 system-tests jobs +
# 2 phpstan jobs all fetching the same build in a short window.
# actions/cache uses a different, more stable backend for this.
#
# The trade-off: keying on github.run_id means these cache entries are
# never reused across runs and just occupy space in the repo's 10GB
# cache budget until GitHub's LRU eviction or the 7-day unused-entry
# cutoff clears them. That's an acceptable cost for reliability here —
# just don't be surprised if you see cache eviction warnings on other,
# genuinely-reusable caches (composer/npm/cypress) if the budget gets tight.
# -------------------------------------------------
  prepare_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        joomla-version: ['5.4', '6.1']
    container:
      image: joomlaprojects/docker-images:cypress8.3
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-dependencies
        with:
          npm-cache: 'true'

      - uses: ./.github/actions/setup-cypress

      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            apt-get update && apt-get install -y jq
          fi

      - name: Determine Nightly URL for Joomla ${{ matrix.joomla-version }}
        id: joomla-info
        run: |
          # Anchored pattern: avoids "5.4" matching "5.40" / "15.4" / etc.
          URL=$(curl -s "https://api.github.com/repos/joomla/joomla-cms/releases" | \
                jq -r '.[] | .assets[] | .browser_download_url' | \
                grep -E "Joomla_${{ matrix.joomla-version }}\.[0-9]+-.*Full_Package\.zip" | \
                head -1)

          if [ -z "$URL" ]; then
            echo "::error::Could not find URL for version ${{ matrix.joomla-version }} in joomla/joomla-cms releases."
            exit 1
          fi
          echo "📦 Joomla ${{ matrix.joomla-version }} URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "url_hash=$(echo -n "$URL" | md5sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      # This cache IS a good fit for actions/cache: keyed on the actual
      # download URL hash, so it's genuinely reused across runs/PRs as
      # long as the nightly build hasn't changed.
      - name: Cache Joomla Zip (download cache)
        id: cache-joomla
        uses: actions/cache@v5
        with:
          path: joomla.zip
          key: joomla-core-${{ matrix.joomla-version }}-${{ steps.joomla-info.outputs.url_hash }}

      - name: Download Joomla ${{ matrix.joomla-version }}
        if: steps.cache-joomla.outputs.cache-hit != 'true'
        run: |
          echo "⬇️ Downloading from: ${{ steps.joomla-info.outputs.url }}"
          curl -LfsS "${{ steps.joomla-info.outputs.url }}" -o joomla.zip

      - name: Build and Verify
        run: |
          echo "📦 Downloaded Joomla ${{ matrix.joomla-version }} from: ${{ steps.joomla-info.outputs.url }}"
          vendor/bin/robo build
          if ! unzip -t joomla.zip > /dev/null 2>&1; then
            echo "ERROR: joomla.zip is invalid or not found."
            exit 1
          fi

      - name: Save build to cache
        uses: actions/cache/save@v5
        with:
          path: |
            dist/
            joomla.zip
          key: build-artifacts-${{ github.run_id }}-j${{ matrix.joomla-version }}

# -------------------------------------------------
# PHPSTAN
# Non-blocking, parallel with system-tests (both only need prepare_tests).
# Previously system-tests waited on phpstan for no reason: phpstan is
# continue-on-error and produces nothing system-tests consumes.
# -------------------------------------------------
  phpstan:
    runs-on: ubuntu-latest
    needs: prepare_tests
    strategy:
      matrix:
        joomla-version: ['5.4', '6.1']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Restore build from cache
        uses: actions/cache/restore@v5
        with:
          path: |
            dist/
            joomla.zip
          key: build-artifacts-${{ github.run_id }}-j${{ matrix.joomla-version }}
          fail-on-cache-miss: true

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        continue-on-error: true
        run: |
          unzip -q joomla.zip -d joomla
          ./vendor/bin/phpstan analyse src --level=5 --no-progress --no-interaction

# -------------------------------------------------
# SYSTEM TESTS
# Only needs prepare_tests (see phpstan note above).
#
# Matrix sparsified from a full 2x4x3 cross-product (24 cells, minus 2
# excludes = 22 jobs) to a pairwise/sparse list: every PHP version and
# every DB is still covered at least once, but not every combination.
# This is the single biggest cost lever in the whole workflow — a full
# cross-product is rarely necessary once you've established that DB
# drivers and PHP versions don't meaningfully interact with each other.
#
# TRADE-OFF: this reduces real coverage. If DB x PHP interaction bugs are
# a genuine concern for this codebase, keep (or restore) the full matrix,
# possibly gated to a nightly/scheduled run or a `full-matrix` label
# instead of running on every push/PR. Adjust the exact pairing below to
# match what you actually want covered.
# -------------------------------------------------
  system-tests:
    runs-on: ubuntu-latest
    needs: prepare_tests
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - joomla-version: '5.4'
            php-version: '8.2'
            db: mysql
            db-type: mysqli
            db-host: mysql
            image: mysql:8.0
            db-prefix: mysql_
            alter-user-cmd: |
              apt-get update && apt-get install -y default-mysql-client
              mysql -h mysql -u root -proot --skip-ssl -e "ALTER USER 'joomla_ut'@'%' IDENTIFIED WITH mysql_native_password BY 'joomla_ut'; FLUSH PRIVILEGES;"
          - joomla-version: '5.4'
            php-version: '8.3'
            db: mariadb
            db-type: mysqli
            db-host: mariadb
            image: mariadb:10.4
            db-prefix: mariadb_
            alter-user-cmd: "apt-get update && apt-get install -y mariadb-client"
          - joomla-version: '5.4'
            php-version: '8.4'
            db: pgsql
            db-type: pgsql
            db-host: postgres
            image: postgres:12-alpine
            db-prefix: pgsql_
            alter-user-cmd: "apt-get update && apt-get install -y postgresql-client"
          - joomla-version: '6.1'
            php-version: '8.3'
            db: mariadb
            db-type: mysqli
            db-host: mariadb
            image: mariadb:10.6
            db-prefix: mariadb_
            alter-user-cmd: "apt-get update && apt-get install -y mariadb-client"
          - joomla-version: '6.1'
            php-version: '8.4'
            db: pgsql
            db-type: pgsql
            db-host: postgres
            image: postgres:12-alpine
            db-prefix: pgsql_
            alter-user-cmd: "apt-get update && apt-get install -y postgresql-client"
          - joomla-version: '6.1'
            php-version: '8.5'
            db: mysql
            db-type: mysqli
            db-host: mysql
            image: mysql:8.0
            db-prefix: mysql_
            alter-user-cmd: |
              apt-get update && apt-get install -y default-mysql-client
              mysql -h mysql -u root -proot --skip-ssl -e "ALTER USER 'joomla_ut'@'%' IDENTIFIED WITH mysql_native_password BY 'joomla_ut'; FLUSH PRIVILEGES;"

    container:
      image: joomlaprojects/docker-images:cypress${{ matrix.php-version }}

    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && matrix.image || 'mysql:8.0' }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ matrix.db == 'mysql' && 'root' || 'unused' }}
          MYSQL_USER: ${{ matrix.db == 'mysql' && 'joomla_ut' || 'unused' }}
          MYSQL_PASSWORD: ${{ matrix.db == 'mysql' && 'joomla_ut' || 'unused' }}
          MYSQL_DATABASE: ${{ matrix.db == 'mysql' && 'test_joomla' || 'unused' }}
      mariadb:
        image: ${{ matrix.db == 'mariadb' && matrix.image || 'mariadb:10.4' }}
        env:
          MARIADB_ROOT_PASSWORD: ${{ matrix.db == 'mariadb' && 'root' || 'unused' }}
          MARIADB_USER: ${{ matrix.db == 'mariadb' && 'joomla_ut' || 'unused' }}
          MARIADB_PASSWORD: ${{ matrix.db == 'mariadb' && 'joomla_ut' || 'unused' }}
          MARIADB_DATABASE: ${{ matrix.db == 'mariadb' && 'test_joomla' || 'unused' }}
      postgres:
        image: postgres:12-alpine
        env:
          POSTGRES_USER: ${{ matrix.db == 'pgsql' && 'root' || 'unused' }}
          POSTGRES_PASSWORD: ${{ matrix.db == 'pgsql' && 'root' || 'unused' }}
          POSTGRES_DB: ${{ matrix.db == 'pgsql' && 'test_joomla' || 'unused' }}
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v6

      - name: Restore build from cache
        uses: actions/cache/restore@v5
        with:
          path: |
            dist/
            joomla.zip
          key: build-artifacts-${{ github.run_id }}-j${{ matrix.joomla-version }}
          fail-on-cache-miss: true

      - uses: ./.github/actions/setup-dependencies
        with:
          npm-cache: 'true'

      - name: Extract Joomla
        run: unzip -q joomla.zip -d joomla

      - uses: ./.github/actions/setup-cypress

      - name: Setup and run ${{ matrix.db }}
        run: |
          ${{ matrix.alter-user-cmd }}
          DB_USER=${{ matrix.db == 'pgsql' && 'root' || 'joomla_ut' }}
          DB_PASS=${{ matrix.db == 'pgsql' && 'root' || 'joomla_ut' }}
          cp -r joomla /tests/www/${{ matrix.db }}
          cp dist/pkg-alikonweb-current.zip /tests/www/${{ matrix.db }}/
          cd /tests/www/${{ matrix.db }}/
          apache2ctl -D FOREGROUND &
          php installation/joomla.php install \
            --verbose \
            --site-name="Joomla test" \
            --admin-email=admin@example.org \
            --admin-username=ci-admin \
            --admin-user="jane doe" \
            --admin-password=joomla-17082005 \
            --db-type=${{ matrix.db-type }} \
            --db-host=${{ matrix.db-host }} \
            --db-name=test_joomla \
            --db-pass=$DB_PASS \
            --db-user=$DB_USER \
            --db-encryption=0 \
            --db-prefix=${{ matrix.db-prefix }}
          # CONFIGURAZIONE EMAIL PER MAILPIT
          php cli/joomla.php config:set mailer=smtp
          php cli/joomla.php config:set smtphost=mailpit
          php cli/joomla.php config:set smtpport=1025
          php cli/joomla.php config:set smtpauth=0
          php cli/joomla.php extension:install --path=/tests/www/${{ matrix.db }}/pkg-alikonweb-current.zip
          mkdir -p tmp/api_rate_limit tmp/plg_system_ratelimit
          chown -R www-data:www-data /tests/www/${{ matrix.db }}/
          chmod -R 777 /tests/www/${{ matrix.db }}/
          echo "=== Test Environment ==="
          php cli/joomla.php --version | head -1
          php -v | head -1
          [ "${{ matrix.db }}" = "pgsql" ] && \
            psql -h ${{ matrix.db-host }} -U $DB_USER -d test_joomla -t -c 'SELECT version();' | head -1 | xargs || \
            mysql -h ${{ matrix.db-host }} -u $DB_USER -p$DB_PASS --skip-ssl -e 'SELECT VERSION();' -s -N
          echo "========================"

      - name: Run normal Cypress tests
        run: |
          cd $GITHUB_WORKSPACE
          DB_USER=${{ matrix.db == 'pgsql' && 'root' || 'joomla_ut' }}
          DB_PASS=${{ matrix.db == 'pgsql' && 'root' || 'joomla_ut' }}
          # Any file matching Update_*.cy.js anywhere under tests/cypress/integration
          # is treated as an upgrade test and excluded from the normal run.
          NORMAL_SPECS=$(find tests/cypress/integration -name '*.cy.js' ! -name 'Update_*.cy.js' | tr '\n' ',' | sed 's/,$//')

          if [ -z "$NORMAL_SPECS" ]; then
            echo "::error::No normal spec files found (excluding Update_*.cy.js)."
            exit 1
          fi

          npx cypress run \
            --browser=chrome \
            --e2e \
            --spec "$NORMAL_SPECS" \
            --config video=false \
            --expose mailpitUrl=http://mailpit:8025,cmsPath=/tests/www/${{ matrix.db }},db_type=${{ matrix.db-type }},db_host=${{ matrix.db-host }},db_name=test_joomla,db_user=$DB_USER,db_password=$DB_PASS,db_prefix=${{ matrix.db-prefix }},email=admin@example.org,logFile=/var/log/apache2/error.log \
            --config baseUrl=http://localhost/${{ matrix.db }}

      - name: Run extension upgrade tests
        run: |
          cd $GITHUB_WORKSPACE
          DB_USER=${{ matrix.db == 'pgsql' && 'root' || 'joomla_ut' }}
          DB_PASS=${{ matrix.db == 'pgsql' && 'root' || 'joomla_ut' }}
          # Matches every Update_*.cy.js file, however many there are.
          UPGRADE_SPECS=$(find tests/cypress/integration -name 'Update_*.cy.js' | tr '\n' ',' | sed 's/,$//')

          if [ -z "$UPGRADE_SPECS" ]; then
            echo "No Update_*.cy.js upgrade tests found — skipping."
            exit 0
          fi

          npx cypress run \
            --browser=chrome \
            --e2e \
            --spec "$UPGRADE_SPECS" \
            --config video=false \
            --expose mailpitUrl=http://mailpit:8025,cmsPath=/tests/www/${{ matrix.db }},db_type=${{ matrix.db-type }},db_host=${{ matrix.db-host }},db_name=test_joomla,db_user=$DB_USER,db_password=$DB_PASS,db_prefix=${{ matrix.db-prefix }},email=admin@example.org,logFile=/var/log/apache2/error.log \
            --config baseUrl=http://localhost/${{ matrix.db }}

      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-j${{ matrix.joomla-version }}-${{ matrix.db }}-php${{ matrix.php-version }}
          path: tests/cypress/output/screenshots
          retention-days: 7
